# Render Blueprint: the whole system on Render, as it runs on one machine.
#
# One web service runs `node server/index.js`, which migrates the database on
# boot and serves both the API and the built interface. Postgres is Render's
# managed database. Receipts and photos go to a persistent disk -- Render
# replaces the code folder on every deploy, so they must not live beside it.
#
# To deploy: Render dashboard -> New -> Blueprint -> pick this repository, fill
# in ADMIN_PASSWORD when asked, then Apply. See DEPLOYMENT.md.

services:
  - type: web
    name: gisuma-operations
    runtime: node
    # A persistent disk needs a paid instance; the free one also sleeps when idle.
    plan: starter
    # The closest Render region to Rwanda.
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: evidence
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gisuma-db
          property: connectionString
      # The service reaches the database over Render's private network, which
      # does not use TLS.
      - key: DATABASE_SSL
        value: "false"
      # A long random value, generated by Render once and kept.
      - key: JWT_SECRET
        generateValue: true
      # The starting password for the `admin` Director account, used once by the
      # first boot. The Director is asked to choose their own at first sign-in.
      - key: ADMIN_PASSWORD
        sync: false
      # Render puts one proxy in front of the service; trusting it lets the
      # login limiter see each caller's real address.
      - key: TRUST_PROXY
        value: "1"
      - key: UPLOADS_DIR
        value: /var/data/uploads

databases:
  - name: gisuma-db
    # The free database is deleted after 30 days, so a paid one holds real records.
    plan: basic-256mb
    region: frankfurt
    databaseName: project_ops
    user: ops
